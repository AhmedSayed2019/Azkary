plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"

}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def fMinSdkVersion = localProperties.getProperty('flutter.minSdkVersion').toInteger()
def fCompileSdkVersion = localProperties.getProperty('flutter.compileSdkVersion').toInteger()


// رقم الإصدار مصدره pubspec.yaml وحده.
//
// كان يُقرأ من local.properties، وذاك ملف لا يكتبه إلا `flutter build`:
// البناء من Android Studio أو من gradle مباشرةً كان يقرأ آخر قيمة كتبها
// فلاتر — أيًّا كان قِدَمها — فتخرج الحزمة برقم إصدار قديم ترفضه Play
// بـ«version code has already been used» بينما pubspec يقول غير ذلك.
// pubspec يُقرأ عند كل بناء، فلا سبيل لانحرافهما بعد اليوم.
def pubspecVersion = {
    def file = rootProject.file('../pubspec.yaml')
    if (!file.exists()) {
        return null
    }
    // مثال السطر: `version: 1.2.8+28`
    def matcher = file.getText('UTF-8') =~ /(?m)^version:\s*([^\s+]+)\+(\d+)\s*$/
    return matcher ? [name: matcher[0][1], code: matcher[0][2]] : null
}()

// مَخرج للتجاوز اليدوي: `./gradlew bundleRelease -PversionCode=29`.
// كان `flutter build --build-number` يؤدّي هذا الدور عبر local.properties،
// وقد سبقه pubspec الآن، فلا بد من بديل صريح.
def flutterVersionCode = project.findProperty('versionCode')
        ?: pubspecVersion?.code
        ?: localProperties.getProperty('flutter.versionCode')
        ?: '1'

def flutterVersionName = project.findProperty('versionName')
        ?: pubspecVersion?.name
        ?: localProperties.getProperty('flutter.versionName')
        ?: '1.0'


android {
    namespace "com.muslim.azkar.app"
    compileSdkVersion fCompileSdkVersion
    ndkVersion = "27.0.12077973"


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }


    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.muslim.azkar.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion fMinSdkVersion
        targetSdkVersion fCompileSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

    }
    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }

        debug {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // R8: يحذف الشيفرة والموارد غير المستخدمة (~15-20MB من dex).
            // قواعد الإبقاء للإضافات في proguard-rules.pro
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // x86_64 للمحاكيات فقط (~29MB) — لا يُشحن في الإصدار. مع
            // --split-per-abi يتولى Flutter التقسيم ويرفض Gradle وجود الفلتر.
            if (!project.hasProperty('split-per-abi')) {
                ndk {
                    abiFilters 'arm64-v8a', 'armeabi-v7a'
                }
            }
        }
    }
    // لا إعادة تسمية لملفات APK: كانت تعطي كل تقسيمات --split-per-abi الاسم
    // نفسه فيكتب أحدها فوق الآخر، وأدوات Flutter تتوقع الأسماء الافتراضية.
}

flutter {
    source '../..'
}


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation platform('com.google.firebase:firebase-bom:31.2.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation fileTree(dir: "libs", include: ["*.aar"])
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
    implementation("androidx.multidex:multidex:2.0.1")

}
